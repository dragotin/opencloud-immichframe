
name: opencloud-immichframe

# Topology
#   client ─▶ traefik :8080 ─▶ opencloud-immichframe  (web UI + API, one origin)
#
# The official ImmichFrame server refuses to boot without a reachable Immich, so
# it cannot run as a headless web-UI container. Instead the official image is
# used as an init container that exports its bundled web UI into a shared
# volume, which opencloud-immichframe then serves via IMMICHFRAME_WEB_ROOT.
# Traefik is the edge proxy (single entrypoint; add TLS/dashboard here later).

volumes:
  webui:

services:
  # Init container: copy the official ImmichFrame web UI into the shared volume, then exit.
  webui:
    # Pinned so a rebuild can't silently swap the UI. Bump IMMICHFRAME_WEBUI_TAG
    # in .env (releases: https://github.com/immichFrame/ImmichFrame/releases).
    image: ghcr.io/immichframe/immichframe:${IMMICHFRAME_WEBUI_TAG:-v1.0.37.0}
    user: "0:0" # write into the root-owned named volume
    # Wipe first: the volume survives `down`, so on a tag bump a plain copy would
    # leave files the new release deleted behind for the backend to keep serving.
    entrypoint:
      - sh
      - -c
      - 'rm -rf /web/* /web/.[!.]* 2>/dev/null; cp -r /app/wwwroot/. /web/
         && echo "ImmichFrame web UI exported to /web"'
    volumes:
      - webui:/web
    restart: "no"

  # Our Go backend — serves the API from an OpenCloud space AND the web UI from the volume.
  opencloud-immichframe:
    build:
      context: .
    image: opencloud-immichframe:local
    restart: unless-stopped
    depends_on:
      webui:
        condition: service_completed_successfully
    # Lets the container reach an OpenCloud running on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # All service config comes from .env, passed verbatim (names match what the
    # binary reads). Commented-out vars in .env are simply not set, so the
    # binary's built-in defaults apply. This avoids forwarding empty strings,
    # which would otherwise blank out defaults.
    env_file:
      - .env
    environment:
      # Compose-controlled: the web UI lives in the shared volume at /web.
      IMMICHFRAME_WEB_ROOT: /web
    volumes:
      - webui:/web:ro

  # Edge proxy. Uses the file provider (no Docker socket needed) and forwards
  # everything to the backend by service name on the compose network.
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    depends_on:
      - opencloud-immichframe
    command:
      - --entryPoints.web.address=:8080
      - --providers.file.filename=/etc/traefik/dynamic.yml
      # - --api.dashboard=true
      # - --log.level=DEBUG
    ports:
      - "${LISTEN_PORT:-8080}:8080"
    volumes:
      # :z relabels for SELinux hosts; harmless elsewhere.
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro,z
